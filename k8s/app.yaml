# Demo deployment on the Spark k3s cluster. Apply with scripts/deploy_spark.py, which first creates the
# Secret `compressor-copilot-env` from .env (AMD_VLLM_*, EVOLUS_API_KEY, EVOLUS_APP_ID).
# TLS ends at the Cloudflare edge; the tunnel sends plain HTTP to ingress-nginx, hence no tls: block.
# The host must keep the agenticai* prefix, or the zone's marketing redirect swallows it.
apiVersion: v1
kind: Namespace
metadata:
  name: compressor-copilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compressor-copilot
  namespace: compressor-copilot
spec:
  replicas: 1  # Streamlit keeps sessions in memory
  selector:
    matchLabels: {app: compressor-copilot}
  template:
    metadata:
      labels: {app: compressor-copilot}
    spec:
      containers:
        - name: app
          image: brainupgrade/compressor-copilot:0.1.2
          ports: [{containerPort: 8501}]
          envFrom: [{secretRef: {name: compressor-copilot-env}}]
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "2", memory: 3Gi}
          startupProbe:  # first start downloads the public UCI datasets
            httpGet: {path: /_stcore/health, port: 8501}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: compressor-copilot
  namespace: compressor-copilot
spec:
  selector: {app: compressor-copilot}
  ports: [{port: 80, targetPort: 8501}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compressor-copilot
  namespace: compressor-copilot
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"  # Streamlit websocket
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: agenticai-compressor.brainupgrade.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: compressor-copilot, port: {number: 80}}
